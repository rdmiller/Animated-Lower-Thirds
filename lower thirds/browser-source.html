<!DOCTYPE html>
<html lang="en">
  <head>
  	<!--Animated Lower Thirds v1.6-->
    <meta charset="utf-8">
	<meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Lower thirds Source</title>
	<link rel="stylesheet" href="../common/css/style-source.css">

 </head>
  <body class="browser-source lower-thirds">
		<!--One copy is made per lower third; "N" is replaced by its number-->
		<template id="lower-third-template">
			<div id="lower-third-N" class="alt left style-1 hide-anim">
				<div id="alt-N-logo" class="logo no-logo">
					<img id="alt-N-logo-image" src="//:0" />
				</div>
				<div class="graph-1"></div>
				<div class="text-content">
					<div class="text-mask">
						<div id="alt-N-name"></div>
					</div>
					<div class="text-mask">
						<div id="alt-N-info"></div>
					</div>
				</div>
				<div class="graph-2"></div>
			</div>
		</template>

	 <script type="text/javascript">
		//Check preview
		function getUrlParameter(sParam) {
		    let sPageURL = window.location.search.substring(1),
		        sURLVariables = sPageURL.split('&'),
		        sParameterName,
		        i;

		    for (i = 0; i < sURLVariables.length; i++) {
		        sParameterName = sURLVariables[i].split('=');

		        if (sParameterName[0] === sParam) {
		            return sParameterName[1] === undefined ? true : decodeURIComponent(sParameterName[1]);
		        }
		    }
		};

		const mode = getUrlParameter('mode');

		//Check mode and change de channel to receive switches orders or preview orders
		if (mode == "preview") {
			document.body.classList.add('preview');
		}

		const bcp = new BroadcastChannel('obs-lower-thirds-channel'); //Receives from the source
		const bcr = new BroadcastChannel('obs-lower-thirds-channel2'); //Send to Control Panel
		const bcf = new BroadcastChannel('obs-lower-thirds-fonts');

		//Number of lower thirds. The control panel and the CSS both define 4.
		const LOWER_THIRDS_COUNT = 4;

		//State of each lower third, indexed by number (1 to LOWER_THIRDS_COUNT)
		const lowerThirds = [];

		for (let n = 1; n <= LOWER_THIRDS_COUNT; n++) {
			const markup = document.getElementById("lower-third-template").innerHTML.replace(/-N\b/g, "-" + n);
			document.body.insertBefore(document.createRange().createContextualFragment(markup), document.getElementById("lower-third-template"));

			lowerThirds[n] = {
				n: n,
				id: "lower-third-" + n,
				el: document.getElementById("lower-third-" + n),
				defaultLogo: "../logos/logo_" + n + ".png",
				canIn: false,
				activeCount: 0,		//Seconds shown
				inactiveCount: 0,	//Seconds hidden
				activeTimer: undefined,
				inactiveTimer: undefined,
				activeIsOn: 0,
				inactiveIsOn: 0,
				turnoff: undefined,
				alignOld: "left",
				styleOld: undefined,
				logoImageOld: undefined,
				animationTime: undefined,
				activeTime: undefined,
				inactiveTime: undefined,
				oneshot: undefined,
			};
		}

		function animationIn(lt) {
			lt.el.classList.remove("animation-out");
			void lt.el.offsetWidth;
			lt.el.classList.add("animation-in");
		}

		function animationOut(lt) {
			lt.el.classList.remove("animation-in");
			void lt.el.offsetWidth;
			lt.el.classList.add("animation-out");
		}

		function activeCount(lt) {
			if (lt.activeCount <= lt.activeTime){
				lt.activeCount = lt.activeCount + 1;
				lt.activeTimer = setTimeout(activeCount, 1000, lt);
			} else {
				stopTimeCount(lt);
				startInactiveCount(lt);
			}
		}

		function inactiveCount(lt) {
			if (lt.inactiveCount <= lt.inactiveTime){
				lt.inactiveCount = lt.inactiveCount + 1;
				lt.inactiveTimer = setTimeout(inactiveCount, 1000, lt);
			} else {
				startActiveCount(lt);
				lt.inactiveCount = 0;
				clearTimeout(lt.inactiveTimer);
				lt.inactiveIsOn = 0;
			}
		}

		// Can start Active time counter? Start Animation In
		function startActiveCount(lt) {
			if (!lt.activeIsOn) {
				lt.activeIsOn = true;
				activeCount(lt);
				animationIn(lt);
			}
		}

		// Can start Inactive time counter? Start Animation Out
		function startInactiveCount(lt) {
			if (!lt.inactiveIsOn) {
				lt.inactiveIsOn = true;
				if (!lt.oneshot){
					inactiveCount(lt);
				} else {
					lt.turnoff = true;
				}
				animationOut(lt);
			}
		}

		// Stop active and inactive states.
		function stopTimeCount(lt) {
			lt.activeCount = 0;
			lt.inactiveCount = 0;
			lt.activeIsOn = 0;
			lt.inactiveIsOn = 0;
			clearTimeout(lt.inactiveTimer);
			clearTimeout(lt.activeTimer);

			animationOut(lt);
		}

		//Show or hide the logo if the logo switch is ON.
		function changeLogoVisibility(lt, logo_switch, logo_image) {
			if (logo_switch == "true") {
				document.getElementById("alt-" + lt.n + "-logo").classList.remove("no-logo");
				loadLogo("alt-" + lt.n + "-logo-image", logo_image);
			} else {
				document.getElementById("alt-" + lt.n + "-logo").classList.add("no-logo");
				loadLogo("alt-" + lt.n + "-logo-image");
			}
		}

		//Apply the settings of one lower third. The control panel sends every setting of
		//lower third N as "alt_N_<setting>"; read(<setting>) returns that value.
		function updateLowerThird(lt, received_data, global) {
			const read = (setting) => received_data["alt_" + lt.n + "_" + setting];
			const setCss = (property, value) => document.documentElement.style.setProperty("--alt-" + lt.n + "-" + property, value);

			const style = read("style"), name = read("name"), info = read("info"),
				background_switch = read("background_switch"), border_switch = read("border_switch"),
				shadows = read("shadows"), shadow_amount = read("shadow_amount"), logo_switch = read("logo_switch"),
				align = read("align") === undefined ? "left" : read("align"),
				logo_image = read("logo_image") === undefined ? lt.defaultLogo : read("logo_image");
			let lt_switch = read("switch"), style_color_1 = read("style_color_1"), style_color_2 = read("style_color_2"),
				style_color_3 = read("style_color_3"), style_color_4 = read("style_color_4"),
				line_spacing = read("line_spacing"), border_thickness_amount = read("border_thickness_amount");

			document.getElementById("alt-" + lt.n + "-name").textContent = name;
			document.getElementById("alt-" + lt.n + "-info").textContent = info;

			if (background_switch == "false"){
				style_color_1 = "none";
				style_color_2 = "none";
			}

			line_spacing = line_spacing * 0.1;
			border_thickness_amount = border_thickness_amount * 0.1;

			if (border_switch == "false"){
				style_color_3 = "none";
				style_color_4 = "none";
				border_thickness_amount = 0;
			}

			//Use the global times settins if custom times is empty
			lt.animationTime = Number(read("animation_time") || global.animation_time);
			lt.activeTime = Number(read("active_time") || global.active_time);
			lt.inactiveTime = Number(read("inactive_time") || global.inactive_time);

			//Use the global oneshot setting if oneshot switch is off or inactive field is empty
			lt.oneshot = read("oneshot") || (global.oneshot && !read("inactive_time"));

			if (lt.inactiveTime < lt.animationTime){
				lt.inactiveTime = lt.animationTime;
			}
			if (lt.activeTime < lt.animationTime){
				lt.activeTime = lt.animationTime;
			}

			//Set time infinite in the preview panel
			if (mode == "preview"){
				lt.activeTime = Infinity;
				lt_switch = read("preview");
			}

			//Check the switches
			if (lt_switch == "false" || name.length == 0 || info.length == 0) {
				lt.canIn = false;
				stopTimeCount(lt);
			} else {
				if(!lt.canIn){
					lt.canIn = true;
					lt.el.classList.remove("hide-anim");
					startActiveCount(lt);
				}
			};

			//Change the alignment of the lower third
			if (align != lt.alignOld){
				if (lt_switch == "false"){
					lt.el.classList.add("hide-anim");
				}
				lt.el.classList.replace("left", align);
				lt.el.classList.replace("center", align);
				lt.el.classList.replace("right", align);
			}
			lt.alignOld = align;

			//Change the style of the lower third
			if (style != lt.styleOld){
				if (lt_switch == "false"){
					lt.el.classList.add("hide-anim");
				}
				const oldStyle = Array.from(lt.el.classList).find((c) => c.startsWith("style-"));
				lt.el.classList.replace(oldStyle, "style-" + style);
			}
			lt.styleOld = style;

			///////////////////////////

			//Load logo when it change
			if (logo_image != lt.logoImageOld) {
				loadLogo("alt-" + lt.n + "-logo-image", logo_image);
			}
			lt.logoImageOld = logo_image;

			changeLogoVisibility(lt, logo_switch, logo_image);

			///////////////////////////

			setCss('animation-time', lt.animationTime + "s");

			//texts styling
			setCss('size', read("size") + "px");
			setCss('margin-h', read("margin_h") + "rem");
			setCss('margin-v', read("margin_v") + "rem");
			setCss('line-spacing', line_spacing + "em");
			setCss('name-size', read("name_size") + "em");
			setCss('info-size', read("info_size") + "em");
			setCss('name-transform', read("name_transform"));
			setCss('info-transform', read("info_transform"));
			setCss('name-weight', read("name_weight"));
			setCss('name-style', read("name_style"));
			setCss('info-weight', read("info_weight"));
			setCss('info-style', read("info_style"));
			setCss('name-color', read("name_color"));
			setCss('info-color', read("info_color"));
			setCss('style-color-1', style_color_1);
			setCss('style-color-2', style_color_2);
			setCss('style-color-3', style_color_3);
			setCss('style-color-4', style_color_4);
			setCss('font', read("font"));
			setCss('logo-size', read("logo_size") + "em");
			setCss('corners', read("corners") + "em");
			setCss('border-switch', border_switch);
			setCss('border_thickness_amount', border_thickness_amount + "rem");

			//Hide the background shadow if color is transparent (end with ",0)")
			if (style_color_2.match(/,0\)$/)) {
				setCss('background', "0");
			} else {
				setCss('background', "1");
			}

			if (shadows == "false"){
				setCss('shadows', "none");
				setCss('shadows-graph', "none");
			}
			if (shadows == "true") {
				setCss('shadows', "0.1rem 0.1rem 0.2rem rgba(0,0,0," + shadow_amount + ")");
				if (background_switch == "false"){
					setCss('shadows-graph', "none");
				} else {
					setCss('shadows-graph', "0.1rem 0.1rem 0.2rem rgba(0,0,0," + shadow_amount + ")");
				}
			}
		}

		///////////////////////////
		bcp.onmessage = function (ev) {
			const received_data = ev.data;
			const global = {
				animation_time: received_data.global_animation_time,
				active_time: mode != "preview" ? received_data.global_active_time : Infinity,
				inactive_time: received_data.global_inactive_time,
				oneshot: received_data.global_oneshot,
			};

			for (let n = 1; n <= LOWER_THIRDS_COUNT; n++) {
				updateLowerThird(lowerThirds[n], received_data, global);
			}
		}

		bcf.onmessage = function (ev) {
			received_data = ev.data;
			new_font = received_data.new_font_to_send;

			//console.log(new_font);
			const style = document.createElement("style");
			style.textContent = new_font;
			document.head.appendChild(style);
		}

		function loadLogo(alt,logo) {
			document.getElementById(alt).setAttribute("src", logo ? logo : '//:0');
		}


		//Send data to Control Panel: seconds shown/hidden and turn off requests of each lower third
		function function_send() {
			const data = {};

			for (let n = 1; n <= LOWER_THIRDS_COUNT; n++) {
				data["activeTime" + n + "_to_send"] = Math.max(lowerThirds[n].activeCount - 1, 0);
				data["inactiveTime" + n + "_to_send"] = Math.max(lowerThirds[n].inactiveCount - 1, 0);
			}
			for (let n = 1; n <= LOWER_THIRDS_COUNT; n++) {
				data["alt_" + n + "_turnoff"] = lowerThirds[n].turnoff;
			}

			bcr.postMessage(data);

			for (let n = 1; n <= LOWER_THIRDS_COUNT; n++) {
				lowerThirds[n].turnoff = false;
			}
		}

		function refreshData() {
		    if (mode != "preview"){
		    	function_send();
		    }
		}

		const x = 1; // Refresh time multiplier
		setInterval(refreshData, x * 1000);
		bcr.postMessage({resend: true});

	</script>

  </body>
</html>
